# session-digger smoke gate — pure-stdlib checklist.
# Triggers: push + PR against main. Runs: syntax compile, unit tests,
# bash smoke (test-echolib.sh).
name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check (scripts + tests)
        run: python3 -m compileall -q scripts/ tests/

      - name: Unit tests (unittest discover)
        run: python3 -m unittest discover -s tests -v

      - name: Public-API gate (adapter-split compatibility)
        run: python3 tests/_check_public_api.py

      - name: Echolib bash smoke
        run: bash tests/test-echolib.sh

      - name: Python 3.6+ syntax baseline (py_compile the CLI entry)
        run: |
          for p in scripts/sd-recall.py scripts/index-builder.py scripts/reflect-report.py scripts/skill-gap-finder.py; do
            python3 -m py_compile "$p"
          done
