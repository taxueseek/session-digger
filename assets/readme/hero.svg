<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">session-digger</title>
  <desc id="desc">Cross-environment AI session mining, SQLite FTS5 search, token analytics, and offline HTML usage recap across 20+ coding agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3eee5"/>
      <stop offset="100%" stop-color="#ebe4d8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffcf7"/>
      <stop offset="100%" stop-color="#f5efe6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#e0d6c8" stroke-width="1"/>
  <rect x="0" y="48" width="4" height="284" fill="#b34f32" opacity="0.9"/>

  <!-- Left title block -->
  <g transform="translate(56 48)">
    <text x="0" y="18" fill="#8f3a24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">CROSS-ENV SESSION MEMORY · MCP + CLI</text>
    <text x="0" y="78" fill="#1a1612" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="52" font-weight="700">session-digger</text>
    <text x="0" y="118" fill="#4a433c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="19">Turn scattered AI coding chats into searchable local memory</text>
    <text x="0" y="148" fill="#6f675e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15">Claude Code · Codex · Cursor · Grok · Kimi · Antigravity · 20+ agents</text>
    <text x="0" y="176" fill="#6f675e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15">SQLite FTS5 &lt;50ms search · Zero pip deps · 100% offline HTML recap</text>

    <g transform="translate(0 212)">
      <rect width="122" height="34" rx="17" fill="#b34f32"/>
      <text x="61" y="22" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600">20+ agents</text>
      <rect x="132" width="118" height="34" rx="17" fill="#fffcf7" stroke="#e0d6c8"/>
      <text x="191" y="22" text-anchor="middle" fill="#1a1612" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600">6 MCP tools</text>
      <rect x="260" width="126" height="34" rx="17" fill="#fffcf7" stroke="#e0d6c8"/>
      <text x="323" y="22" text-anchor="middle" fill="#1a1612" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600">FTS5 &lt;50ms</text>
      <rect x="396" width="124" height="34" rx="17" fill="#fffcf7" stroke="#e0d6c8"/>
      <text x="458" y="22" text-anchor="middle" fill="#1a1612" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600">0 pip deps</text>
    </g>

    <g transform="translate(0 274)" font-family="ui-monospace, Menlo, monospace" font-size="12">
      <text x="0" y="0" fill="#8f3a24">raw logs</text>
      <text x="72" y="0" fill="#a89e92">→</text>
      <text x="92" y="0" fill="#1a1612">echolib</text>
      <text x="154" y="0" fill="#a89e92">→</text>
      <text x="174" y="0" fill="#b34f32">SQLite FTS5</text>
      <text x="266" y="0" fill="#a89e92">→</text>
      <text x="286" y="0" fill="#1a1612">recall + reflect HTML</text>
    </g>
  </g>

  <!-- Right proof card: Reflect & Search preview -->
  <g transform="translate(694 38)">
    <rect width="452" height="304" rx="18" fill="url(#panel)" stroke="#e0d6c8" stroke-width="1.5"/>
    <text x="24" y="34" fill="#8f3a24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">REFLECT REPORT · 100% LOCAL</text>
    <text x="24" y="64" fill="#1a1612" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="700">Your AI Coding Footprint</text>
    <text x="24" y="88" fill="#6f675e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Time · Tokens · Prompt Cache Hit Rate · Model Split</text>

    <!-- KPI cards -->
    <rect x="24" y="108" width="126" height="64" rx="10" fill="#f3e0d4"/>
    <text x="36" y="130" fill="#6f675e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Active Time</text>
    <text x="36" y="158" fill="#1a1612" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="700">42h</text>

    <rect x="162" y="108" width="132" height="64" rx="10" fill="#fffcf7" stroke="#e0d6c8"/>
    <text x="174" y="130" fill="#6f675e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Tokens Tracked</text>
    <text x="174" y="158" fill="#1a1612" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="700">12.4M</text>

    <rect x="306" y="108" width="122" height="64" rx="10" fill="#fffcf7" stroke="#e0d6c8"/>
    <text x="318" y="130" fill="#6f675e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11">Cache Hit</text>
    <text x="318" y="158" fill="#3d8b6e" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="700">74.2%</text>

    <!-- stacked env bar -->
    <rect x="24" y="192" width="404" height="10" rx="5" fill="#efe9df"/>
    <rect x="24" y="192" width="148" height="10" rx="5" fill="#b34f32"/>
    <rect x="172" y="192" width="96" height="10" fill="#5b7cfa"/>
    <rect x="268" y="192" width="70" height="10" fill="#6b5b95"/>
    <rect x="338" y="192" width="52" height="10" fill="#3d8b6e"/>
    <rect x="390" y="192" width="38" height="10" rx="0 5 5 0" fill="#c48a3a"/>

    <text x="24" y="222" fill="#6f675e" font-family="ui-monospace, Menlo, monospace" font-size="11">Claude · Codex · Cursor · Kimi · Antigravity</text>

    <rect x="24" y="242" width="404" height="42" rx="10" fill="#1a1612"/>
    <text x="38" y="268" fill="#f3eee5" font-family="ui-monospace, Menlo, monospace" font-size="12">$ npx -y session-digger reflect --open</text>
  </g>
</svg>
