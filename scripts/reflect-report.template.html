<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AI 使用回顾</title>
<style>
/* ═══ Palette (dataviz reference) ═══ */
:root{
  --surface:#fcfcfb; --page:#f9f9f7; --ink:#0b0b0b; --sec:#52514e; --mute:#898781;
  --line:rgba(11,11,11,0.10); --grid:#e1e0d9;
  --good:#006300; --warn:#9a6b2f; --bad:#9b3b2e;
  --accent:#2a78d6; --accent-s:#cde2fb; --accent-d:#1c5cab;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  --nav:200px; --r:12px;
  /* Sequential blue ramp (L2→L5 for heat) */
  --h1:#9ec5f4; --h2:#6da7ec; --h3:#3987e5; --h4:#1c5cab; --h0:rgba(158,197,244,0.12);
  /* Categorical (8-slot fixed order) */
  --c1:#2a78d6; --c2:#1baf7a; --c3:#eda100; --c4:#008300;
  --c5:#4a3aa7; --c6:#e34948; --c7:#e87ba4; --c8:#eb6834;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--page);line-height:1.55}
.app{display:grid;grid-template-columns:var(--nav) minmax(0,1fr);min-height:100vh}

/* Sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:24px 12px 32px;
  border-right:1px solid var(--line);background:var(--surface)}
.brand{font-size:1.05rem;font-weight:600;letter-spacing:-.01em;margin:0 4px 2px}
.brand-sub{color:var(--mute);font-size:.72rem;margin:0 4px 16px}
.nav-label{font-size:.65rem;letter-spacing:.06em;color:var(--mute);margin:14px 10px 6px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;
  text-align:left;padding:8px 10px;border-radius:8px;font:inherit;font-size:.85rem;
  color:var(--sec);cursor:pointer;margin-bottom:1px}
.nav-item:hover{background:rgba(42,120,214,.06);color:var(--ink)}
.nav-item.active{background:rgba(42,120,214,.1);color:var(--accent);font-weight:600}
.nav-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.nav-count{margin-left:auto;font-size:.7rem;color:var(--mute);font-variant-numeric:tabular-nums}
.main{padding:28px 32px 72px;max-width:960px;position:relative}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-top:16px}
.card-sm{padding:14px 16px}
.card h2{font-size:1rem;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}
.card-desc{color:var(--mute);font-size:.82rem;margin:0 0 12px}
.card-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:6px;background:rgba(42,120,214,.1);color:var(--accent);font-size:.68rem;font-weight:700;margin-right:7px;vertical-align:middle}

/* Stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 8px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.st-l{color:var(--mute);font-size:.75rem;font-weight:500}
.st-v{font-size:1.5rem;font-weight:600;margin:2px 0;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.st-h{color:var(--mute);font-size:.7rem}
.st-t{font-size:.7rem;font-weight:500;margin-left:4px}

/* Period seg */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:2px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.seg button{border:0;background:transparent;color:var(--sec);padding:7px 12px;
  border-radius:999px;font:inherit;font-size:.82rem;cursor:pointer;transition:all .1s}
.seg button.active{background:var(--accent);color:#fff;font-weight:500}

/* Heatmap */
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);
  grid-auto-columns:14px;gap:3px;width:max-content}
.cell{width:14px;height:14px;border-radius:3px;cursor:pointer;transition:opacity .1s}
.cell:hover{opacity:.7;box-shadow:0 0 0 2px var(--accent)}
.cell[data-l="1"]{background:var(--h1)}.cell[data-l="2"]{background:var(--h2)}
.cell[data-l="3"]{background:var(--h3)}.cell[data-l="4"]{background:var(--h4)}
.cell[data-l="0"]{background:var(--h0)}
/* Hour heatmap */
.hh{display:grid;grid-template-columns:36px repeat(24,14px);gap:3px;align-items:center}
.hh .lb{font-size:.65rem;color:var(--mute);text-align:right;padding-right:3px;line-height:14px}
.h{width:14px;height:14px;border-radius:3px}
.h[data-l="1"]{background:var(--h1)}.h[data-l="2"]{background:var(--h2)}
.h[data-l="3"]{background:var(--h3)}.h[data-l="4"]{background:var(--h4)}
.h[data-l="0"]{background:var(--h0)}
.xaxis{display:grid;grid-template-columns:36px repeat(24,14px);gap:3px;margin-top:4px}
.xaxis span{font-size:.58rem;color:var(--mute);text-align:center}

/* Bars (task, env) */
.br{display:grid;grid-template-columns:1fr 32px;gap:6px;align-items:center;margin:5px 0}
.br .bt{display:flex;align-items:center;gap:6px;font-size:.85rem}
.br .bf{height:8px;border-radius:999px;min-width:4px}
.br .bv{font-size:.78rem;color:var(--sec);text-align:right;font-variant-numeric:tabular-nums}

/* Topic / session cards */
.tpc{padding:9px 12px;background:var(--page);border-radius:8px;font-size:.88rem;margin:3px 0}
.sc{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:6px 0;
  cursor:pointer;background:var(--surface);transition:border-color .12s}
.sc:hover{border-color:var(--accent)}
.back-btn,.up-btn{border:0;background:transparent;color:var(--accent);font:inherit;
  font-size:.84rem;cursor:pointer;padding:0}

/* Env cards */
.ec{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  background:var(--surface);transition:transform .1s,border-color .1s}
.ec:hover{transform:translateY(-1px);border-color:var(--accent)}
.ec .n{font-size:1.3rem;font-weight:600;margin:4px 0 1px;letter-spacing:-.02em}
.ec .sub{color:var(--mute);font-size:.74rem}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{color:var(--mute);font-weight:500;font-size:.74rem;text-align:left;padding:8px;border-bottom:1px solid var(--grid)}
.tbl td{padding:8px;border-bottom:1px solid var(--grid)}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}

/* Habit shift mini-bars */
.hb{display:grid;grid-template-columns:1fr 48px;gap:6px;align-items:center;margin:4px 0;font-size:.84rem}
.hb .hb-b{display:flex;gap:3px;align-items:center}
.hb .hb-f{height:6px;border-radius:999px;min-width:2px}

/* Cal legend */
.cl{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:.7rem;margin-top:8px}

/* Reflections */
.qa{border-left:3px solid var(--accent);padding:2px 0 2px 13px;margin:14px 0}
.qa h3{margin:0 0 4px;font-size:.92rem;font-weight:600}
.qa p{margin:0;color:var(--sec);font-size:.88rem;line-height:1.5}

/* Utility */
.ep{padding:32px 0;color:var(--mute);text-align:center;font-size:.9rem}
.hidden{display:none!important}
.tt{font-size:.7rem;display:inline-block;padding:1px 6px;border-radius:4px;
  background:rgba(42,120,214,.08);color:var(--accent);margin:0 2px}
.tg{font-size:.7rem;display:inline-block;padding:1px 6px;border-radius:4px;margin:0 2px}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .main{padding:16px;max-width:100%}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>
<script id="DATA" type="application/json">__REFLECT_DATA__</script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// DATA LAYER
// ═══════════════════════════════════════════════════════════════════════════
const RAW=JSON.parse(document.getElementById('DATA').textContent);
const S=RAW.sessions; const TREND=RAW.trend||{};
const EM={dim:{l:'DIM',c:'#2a78d6'},grok:{l:'Grok',c:'#1baf7a'},zcode:{l:'ZCode',c:'#eda100'},
  dimcode:{l:'DimCode',c:'#2a78d6'},kimi:{l:'Kimi',c:'#4a3aa7'},claude:{l:'Claude',c:'#eb6834'},
  codex:{l:'Codex',c:'#008300'},trae_cn:{l:'Trae CN',c:'#e34948'},workbuddy:{l:'WorkBuddy',c:'#e87ba4'},
  reasonix:{l:'Reasonix',c:'#1baf7a'},other:{l:'其他',c:'#898781'}};
const CAT=['#2a78d6','#1baf7a','#eda100','#008300','#4a3aa7','#e34948','#e87ba4','#eb6834'];
const BAN=/^(subagent|approval reviewer|longcat|trae cn summary|new session|say hello|介绍下你的能力|users|python|github|preview|ok|test|hi|hey)/i;
let months=1,pg='ov',envF=null,dd=null,ds=null;

function em(k){return EM[k]||EM.other}
function pDT(s){return new Date(String(s).replace(' ','T'))}
function lk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function hf(m){m=Math.round(m||0);if(m<60)return m+'分钟';const h=Math.floor(m/60),r=m%60;return r?h+'小时'+r+'分':h+'小时'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function lv(v,mx){if(!v||mx<=0)return 0;const r=v/mx;return r<.15?1:r<.35?2:r<.65?3:4}
function iP(s){return pDT(s.created)>=new Date(Date.now()-months*30.437*24*3600*1000)}
function po(fe){return S.filter(s=>iP(s)&&(!fe||s.family===fe))}
function eSt(list){const cnt={},min={};list.forEach(s=>{const f=s.family||'other';cnt[f]=(cnt[f]||0)+1;min[f]=(min[f]||0)+s.minutes});return{keys:Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]),cnt,min,total:list.length}}
function fD(a,b){if(!a||!b||b===a)return'';const d=Math.round((b-a)/a*100);if(Math.abs(d)<5)return'';return d>0?'↑'+d+'%':'↓'+Math.abs(d)+'%'}
function cTag(k){return CAT[(Object.keys(EM).indexOf(k)+CAT.length)%CAT.length]}

// ═══════════════════════════════════════════════════════════════════════════
// COMPONENTS
// ═══════════════════════════════════════════════════════════════════════════
const C={};

function _seg(el,oc){
  el.innerHTML='<div class="seg">'+[1,3,6,12].map(m=>`<button data-m="${m}"${m===months?' class="active"':''}>${m===1?'近1个月':'近'+m+'个月'}</button>`).join('')+'</div>';
  el.onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;months=+b.dataset.m;dd=null;ds=null;el.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));oc()};
}

C.Sidebar={render(){
  const list=po(),st=eSt(list);
  document.getElementById('sidebar').innerHTML=
    '<div class="brand">使用回顾</div><div class="brand-sub">· 本机报告</div><div class="nav-label">视图</div>'+
    `<button class="nav-item${pg==='ov'?' active':''}" data-pg="ov"><span class="nav-dot" style="background:var(--accent)"></span>全部环境</button>`+
    '<div class="nav-label">单环境</div>'+
    st.keys.map(k=>`<button class="nav-item${pg==='env'&&envF===k?' active':''}" data-env="${k}">`+
      `<span class="nav-dot" style="background:${em(k).c}"></span>${em(k).l}<span class="nav-count">${st.cnt[k]}</span></button>`).join('')||
    '<div class="ep">暂无</div>';
  document.getElementById('sidebar').onclick=e=>{
    const ov=e.target.closest('[data-pg]');if(ov){pg='ov';envF=null;dd=null;ds=null;render();window.scrollTo({top:0,behavior:'smooth'});return}
    const en=e.target.closest('[data-env]');if(en){pg='env';envF=en.dataset.env;dd=null;ds=null;render();window.scrollTo({top:0,behavior:'smooth'})}
  };
}};

C.Stats={render(list){
  const tM=list.reduce((a,s)=>a+s.minutes,0),ms=list.reduce((a,s)=>a+(s.messages||0),0);
  const tl=list.reduce((a,s)=>a+(s.tools||0),0),er=list.reduce((a,s)=>a+(s.errors||0),0);
  const d=new Set(list.map(s=>s.date)),a=d.size||1;
  const nh=list.length?list.filter(s=>s.hour>=23||s.hour<6).length/list.length:0;
  const long=list.filter(s=>s.minutes>=90).length;
  let tag='';if(list.length>=4){
    const so=[...list].sort((a,b)=>a.created.localeCompare(b.created)),mid=Math.floor(so.length/2);
    const f=so.slice(0,mid),s2=so.slice(mid);
    const fM=f.reduce((a,x)=>a+x.minutes,0),sM=s2.reduce((a,x)=>a+x.minutes,0);
    tag='<span class="tt">后'+fD(fM,sM)+'</span>';
  }
  return '<div class="stats">'+
    [{l:'总用时',v:hf(tM),h:a+'天有活动',t:tag},{l:'会话',v:list.length,h:a+'天',t:''},
     {l:'日均用时',v:hf(tM/a),h:list.length+'次',t:''},{l:'消息',v:ms.toLocaleString(),h:tl+'次工具调用',t:''},
     {l:'工具调用',v:tl.toLocaleString(),h:'出错'+er+'次',t:''},{l:'深夜率',v:Math.round(nh*100)+'%',h:long+'次超长',t:''},
    ].map(k=>'<div class="st"><div class="st-l">'+esc(k.l)+k.t+'</div><div class="st-v">'+k.v+'</div><div class="st-h">'+esc(k.h)+'</div></div>').join('')+'</div>';
}};

C.Cal={render(list,oc){
  const bd={};list.forEach(s=>bd[s.date]=(bd[s.date]||0)+s.minutes);const mx=Math.max(1,...Object.values(bd));
  const nw=new Date(),ct=new Date(Date.now()-months*30.437*24*3600*1000);
  const st=new Date(ct);st.setDate(st.getDate()-((st.getDay()+6)%7));st.setHours(0,0,0,0);const en=new Date(nw);en.setHours(0,0,0,0);
  let h='<div style="overflow-x:auto"><div class="hm">';
  for(let d=new Date(st);d<=en;d.setDate(d.getDate()+1)){const k=lk(d),v=bd[k]||0;const l=d<ct?0:lv(v,mx);h+=`<div class="cell" data-d="${k}" data-l="${l}" title="${k}${v?' ·约'+hf(v):''}" ${d<ct?'style="opacity:.08"':''}></div>`;}
  h+='</div></div><div class="cl"><span>少</span><span class="cell" data-l="0"></span><span class="cell" data-l="1"></span><span class="cell" data-l="2"></span><span class="cell" data-l="3"></span><span class="cell" data-l="4"></span><span>多</span><span style="margin-left:12px">·</span><span style="margin-left:12px">点击格子展开当天</span></div>';
  setTimeout(()=>document.querySelectorAll('.cell[data-d]').forEach(c=>c.onclick=()=>oc(c.dataset.d)),0);
  return h;
}};

C.HM={render(list){
  const g=Array.from({length:7},()=>Array(24).fill(0));list.forEach(s=>g[s.weekday][s.hour]++);
  const mx=Math.max(1,...g.flat());const nm=['周一','周二','周三','周四','周五','周六','周日'];
  let h='';
  for(let r=0;r<7;r++){h+='<div class="hh"><div class="lb">'+nm[r]+'</div>';for(let i=0;i<24;i++){const v=g[r][i];h+=`<div class="h" data-l="${lv(v,mx)}" title="${nm[r]}${i}时·${v}次"></div>`;}h+='</div>';}
  h+='<div class="xaxis"><span></span>'+Array.from({length:24},(_,i)=>i%4===0?`<span>${i}</span>`:'<span></span>').join('')+'</div>';
  return h;
}};

C.Env={render(list,oc){
  const st=eSt(list),t=Math.max(1,st.total);
  const bar=st.keys.map(k=>`<span data-env="${k}" style="display:inline-block;height:100%;width:${Math.max(1,st.cnt[k]/t*100)}%;background:${em(k).c};min-width:4px;cursor:pointer" title="${em(k).l} ${st.cnt[k]}次"></span>`).join('');
  const grid=st.keys.map(k=>`<div class="ec" data-env="${k}"><div style="font-size:.88rem;font-weight:600"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${em(k).c};vertical-align:middle;margin-right:5px"></span>${em(k).l}</div><div class="n">${st.cnt[k]}</div><div class="sub">${hf(st.min[k]||0)} · ${Math.round(st.cnt[k]/t*100)}%</div></div>`).join('');
  setTimeout(()=>document.querySelectorAll('[data-env]').forEach(el=>el.onclick=()=>oc(el.dataset.env)),0);
  return '<div style="display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--grid);margin-bottom:12px">'+bar+'</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">'+grid+'</div>';
}};

C.Tasks={render(list){
  const tc={};list.forEach(s=>tc[s.task]=(tc[s.task]||0)+1);
  const ord=['写代码','调试/修复','写文章/文案','查资料/研究','阅读/笔记','数据分析','设计/规划','投资分析','综合协作','闲聊/纯对话'];
  const mx=Math.max(1,...Object.values(tc),1);
  let ci=0;
  return ord.filter(k=>tc[k]).map(k=>{
    const n=tc[k],pct=Math.round(n/mx*100),col=CAT[ci++%CAT.length];
    return '<div class="br"><div class="bt"><div class="bf" style="width:'+Math.max(4,pct)+'%;background:'+col+'"></div><span>'+k+'</span><span style="color:var(--mute);font-size:.75rem">'+n+'次</span></div><div class="bv">'+Math.round(n/list.length*100)+'%</div></div>';
  }).join('')||'<div class="ep">暂无分类数据</div>';
}};

C.Topics={render(list){
  const c={};let ci=0;
  list.forEach(s=>(s.topics||[]).forEach(t=>{if(t&&t.length>=2&&!BAN.test(t)&&c[t]===void 0)c[t]=1}));
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,12);
  return top.length?top.map(([t])=>'<div class="tpc">'+esc(t)+'</div>').join(''):'<div class="ep">摘要太少</div>';
}};

C.Months={render(list){
  const bm={};list.forEach(s=>{const m=s.date.slice(0,7);if(!bm[m])bm[m]={n:0,min:0,d:new Set()};bm[m].n++;bm[m].min+=s.minutes;bm[m].d.add(s.date)});
  const rows=Object.keys(bm).sort().reverse().map(m=>{const x=bm[m],ad=x.d.size||1,[y,mo]=m.split('-');return `<tr><td>${y}年${Number(mo)}月</td><td class="n">${x.n}</td><td class="n">${hf(x.min)}</td><td class="n">${hf(x.min/ad)}</td><td class="n">${ad}天</td></tr>`;}).join('')||'<tr><td colspan="5" style="color:var(--mute);text-align:center;padding:16px">暂无</td></tr>';
  return '<table class="tbl"><thead><tr><th>月份</th><th class="n">会话</th><th class="n">用时</th><th class="n">日均</th><th class="n">活跃</th></tr></thead><tbody>'+rows+'</tbody></table>';
}};

C.Habit={render(list){
  if(list.length<4)return'<div class="ep">数据太少</div>';
  const so=[...list].sort((a,b)=>a.created.localeCompare(b.created)),mid=Math.floor(so.length/2);
  const f=so.slice(0,mid),s2=so.slice(mid);
  // Env
  const fE=eSt(f),sE=eSt(s2);
  let eH='';
  [...new Set([...fE.keys,...sE.keys])].forEach(k=>{
    const fp=fE.cnt[k]||0,sp=sE.cnt[k]||0;
    if(fp+sp<3)return;
    const fP=Math.round(fp/f.length*100),sP=Math.round(sp/s2.length*100);
    eH+=`<div class="hb"><div class="hb-b"><span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:${em(k).c};margin-right:4px"></span>${em(k).l}<div style="flex:1;height:5px;margin-left:6px;border-radius:999px;overflow:hidden;background:var(--grid)"><div style="float:left;height:100%;width:${fP}%;background:${em(k).c};opacity:.5"></div><div style="float:left;height:100%;width:${Math.max(0,sP-fP)}%;background:${em(k).c}"></div></div></div><div style="text-align:right;color:var(--sec);font-size:.78rem">${fP}%→${sP}%${fD(fp,sp)?' '+fD(fp,sp):''}</div></div>`;
  });
  // Tasks
  const fT={},sT={};f.forEach(x=>fT[x.task]=(fT[x.task]||0)+1);s2.forEach(x=>sT[x.task]=(sT[x.task]||0)+1);
  const aT=[...new Set([...Object.keys(fT),...Object.keys(sT)])];
  let tH='';let ci=0;
  aT.forEach(k=>{
    const fp=fT[k]||0,sp=sT[k]||0;
    if(fp+sp<2)return;
    const fP=Math.round(fp/mid*100),sP=Math.round(sp/s2.length*100);
    const col=CAT[ci++%CAT.length];
    tH+=`<div class="hb"><div class="hb-b"><span>${k}</span><div style="flex:1;height:5px;margin-left:6px;border-radius:999px;overflow:hidden;background:var(--grid)"><div style="float:left;height:100%;width:${fP}%;background:${col};opacity:.5"></div><div style="float:left;height:100%;width:${Math.max(0,sP-fP)}%;background:${col}"></div></div></div><div style="text-align:right;color:var(--sec);font-size:.78rem">${fD(fp,sp)?fD(fp,sp):''}</div></div>`;
  });
  return'<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'+
    '<div style="background:var(--page);border-radius:10px;padding:13px 14px"><div style="font-weight:600;font-size:.85rem;margin-bottom:8px">环境偏好'+(fD(f.length,s2.length)?' '+fD(f.length,s2.length):'')+'</div><div style="font-size:.7rem;color:var(--mute);margin-bottom:6px"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);opacity:.5;vertical-align:middle;margin-right:3px"></span>上半段<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);vertical-align:middle;margin:0 3px 0 8px"></span>下半段</div>'+(eH||'<span style="color:var(--mute)">变化不大</span>')+'</div>'+
    '<div style="background:var(--page);border-radius:10px;padding:13px 14px"><div style="font-weight:600;font-size:.85rem;margin-bottom:8px">任务重心变化</div><div style="font-size:.7rem;color:var(--mute);margin-bottom:6px"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);opacity:.5;vertical-align:middle;margin-right:3px"></span>上半段<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);vertical-align:middle;margin:0 3px 0 8px"></span>下半段</div>'+(tH||'<span style="color:var(--mute)">变化不大</span>')+'</div></div>';
}};

C.DayD={render(list,dk,oc){
  const ds=list.filter(s=>s.date===dk).sort((a,b)=>a.created.localeCompare(b.created));
  if(!ds.length)return'<div class="ep">当天无记录</div>';
  let h='<div style="margin:12px 0"><button class="back-btn">←收起</button><div style="font-weight:600;margin:8px 0 10px">'+dk+' · '+ds.length+'次</div>';
  ds.forEach(s=>{h+=`<div class="sc" data-sid="${s.id}"><div style="display:flex;justify-content:space-between"><span style="font-weight:500;font-size:.88rem">${esc(s.summary||'无摘要')}</span><span style="color:var(--mute);font-size:.74rem">${em(s.family).l}</span></div><div style="display:flex;gap:12px;margin-top:4px;color:var(--sec);font-size:.78rem"><span>${hf(s.minutes)}</span><span>${s.messages||0}条</span><span>${s.tools||0}次工具</span>${s.errors?'<span style="color:var(--bad)">⚠'+s.errors+'</span>':''}<span style="color:var(--mute)">${s.task}</span></div></div>`;});
  h+='</div>';
  setTimeout(()=>{document.querySelectorAll('.sc[data-sid]').forEach(e=>e.onclick=()=>oc(e.dataset.sid));document.querySelector('.back-btn')?.addEventListener('click',()=>{dd=null;render()})},0);
  return h;
}};

C.SD={render(ss,sid){
  const s=ss.find(x=>x.id===sid);if(!s)return'<div class="ep">会话不存在</div>';
  const tu=s.tool_usage||{},tl=Object.entries(tu).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=Math.max(1,...Object.values(tu));
  return '<div style="margin:12px 0"><button class="back-btn">←返回天视图</button><div class="card" style="margin-top:10px">'+
    '<div style="font-weight:600;font-size:.95rem;margin-bottom:10px">'+esc(s.summary||'无摘要')+'</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.85rem">'+
    [['环境',em(s.family).l],['时间',(s.created||'').slice(0,16).replace('T',' ')],['用时',hf(s.minutes)],['消息',s.messages||0],['工具',s.tools||0],['错误',s.errors||0],['Token',s.tokens?String(s.tokens):'—'],['任务',s.task]].map(([k,v])=>'<div><span style="color:var(--mute);font-size:.76rem">'+k+'</span><div style="margin-top:1px">'+v+'</div></div>').join('')+
    (tl.length?'</div><div style="margin-top:12px"><div style="color:var(--mute);font-size:.78rem;margin-bottom:6px">工具分布</div>'+tl.map(([t,n])=>'<div style="display:grid;grid-template-columns:1fr 26px;gap:4px;align-items:center;margin:3px 0"><div style="display:flex;align-items:center;gap:5px"><span style="font-size:.82rem">'+esc(t)+'</span><div style="flex:1;height:5px;background:var(--grid);border-radius:999px;overflow:hidden"><div style="height:100%;width:'+Math.round(n/mx*100)+'%;background:var(--accent);border-radius:999px"></div></div></div><span style="font-size:.75rem;color:var(--sec);text-align:right">'+n+'</span></div>').join('')+'</div>':'</div>')+
  (s.project?'<div style="margin-top:8px;color:var(--mute);font-size:.75rem">项目：'+esc(s.project)+'</div>':'')+
  '</div><button class="up-btn" style="margin-top:8px">←回到总览</button></div>';
}};

C.Ref={render(list){
  const tc={};list.forEach(s=>tc[s.task]=(tc[s.task]||0)+1);
  const tMin=list.reduce((a,s)=>a+s.minutes,0),act=new Set(list.map(s=>s.date)).size||1,dm=tMin/act;
  const nh=list.length?list.filter(s=>s.hour>=23||s.hour<6).length/list.length:0,ln=list.filter(s=>s.minutes>=90).length;
  const chat=(tc['闲聊/纯对话']||0)/Math.max(1,list.length);
  const c=Array(24).fill(0);list.forEach(s=>c[s.hour]++);let b=0;for(let i=1;i<24;i++)if(c[i]>c[b])b=i;
  let q='ok';if(dm>=180||nh>=.25||ln/Math.max(1,list.length)>=.2)q='bad';else if(dm>=90||nh>=.12||ln/Math.max(1,list.length)>=.1)q='warn';
  const st=q==='bad'?'#e34948':q==='warn'?'#eda100':'#008300',sl=q==='bad'?'偏猛':q==='warn'?'有点黏':'还好';
  const ss=[{s:`<span class="tg" style="background:${st}15;color:${st}">${sl}</span>`,t:'1.用太多了吗？',b:`有活动的天日均<b>${hf(dm)}</b>，深夜${Math.round(nh*100)}%，超长${ln}次`},
    {s:'<span class="tg" style="background:#e5efe8;color:var(--good)">结构</span>',t:'2.都在干什么？',b:chat>.35?'闲聊偏多'+Math.round(chat*100)+'%':'写代码和查资料为主'},
    {s:'<span class="tg" style="background:#e5efe8;color:var(--good)">边界</span>',t:'3.哪些该自己做？',b:'定方向、做取舍、对外拍板，更适合你自己'}]
    .map(s=>'<div class="qa"><h3>'+s.s+s.t+'</h3><p>'+s.b+'</p></div>').join('');
  return ss;
}};

function pn(n,t,d,b,ex){return'<div class="card"'+ex+'><h2><span class="card-num">'+n+'</span>'+t+'</h2><p class="card-desc">'+d+'</p>'+b+'</div>'}
function ocEnv(env){pg='env';envF=env;dd=null;ds=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function ocS(sid){ds=sid;render()}

function render(){
  const list=po(envF),m=document.getElementById('main');
  const tb=document.createElement('div');tb.style='display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:8px';
  _seg(tb,()=>{dd=null;ds=null;render()});
  const envL=envF?em(envF).l:'';
  let br=pg==='ov'?'<div style="padding:6px 0 2px"><div style="font-size:.75rem;font-weight:600;color:var(--accent);margin-bottom:6px">本机报告</div><h1 style="font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-.01em">你最近怎么在用 AI</h1><p style="color:var(--sec);margin:3px 0 0;font-size:.92rem">哪些话重复说，哪些不该让AI做</p><div style="color:var(--mute);font-size:.78rem;margin-top:4px">近'+months+'个月 · '+list.length+'次对话</div></div>'
    :'<div style="margin-bottom:8px"><button class="up-btn" id="bov">←全部环境</button></div><div><div style="font-size:.75rem;font-weight:600;color:'+em(envF).c+';margin-bottom:6px">单环境</div><h1 style="font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-.01em">'+envL+'</h1><div style="color:var(--mute);font-size:.78rem;margin-top:4px">'+list.length+'次对话</div></div>';
  let body='';
  if(ds){body=C.SD.render(S,ds);setTimeout(()=>{document.querySelectorAll('.back-btn').forEach(e=>e.onclick=()=>{ds=null;render()});document.querySelector('.up-btn')?.addEventListener('click',()=>{ds=null;dd=null;render()})},0);}
  else if(dd){body=C.DayD.render(list,dd,ocS);}
  else{body=C.Stats.render(list)+
    pn(1,'各家环境','',C.Env.render(list,ocEnv))+
    pn(2,'哪天用得最多','格子越深越活跃，蓝色越深耗时越多',C.Cal.render(list,d=>{dd=d;render()}))+
    pn(3,'一天里什么时候最活跃','横轴小时，竖轴星期',C.HM.render(list))+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px">'+
      pn(4,'任务分布','',C.Tasks.render(list),' style="margin-top:0"')+
      pn(5,'高频话题','',C.Topics.render(list),' style="margin-top:0"')+
    '</div>'+
    pn(6,'三件事想想','',C.Ref.render(list))+
    pn(7,'逐月看','',C.Months.render(list))+
    pn(8,'习惯变化','前后半段偏好对比',C.Habit.render(list));
  }
  m.innerHTML='';m.appendChild(tb);m.insertAdjacentHTML('beforeend',br+body);
  C.Sidebar.render();
  document.getElementById('bov')?.addEventListener('click',()=>{pg='ov';envF=null;dd=null;ds=null;render();window.scrollTo({top:0,behavior:'smooth'})});
  // Attach session detail back buttons
  if(ds){const btns=document.querySelectorAll('.back-btn');btns.forEach(b=>b.onclick=()=>{ds=null;render()});}
}
render();
</script>
</body>
</html>
