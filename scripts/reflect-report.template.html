  });
  const fT={}, sT={};
  f.forEach(x => { fT[x.task]=(fT[x.task]||0)+1; });
  s2.forEach(x => { sT[x.task]=(sT[x.task]||0)+1; });
  let tH = "";
  [...new Set([...Object.keys(fT),...Object.keys(sT)])]
    .sort((a,b)=>(sT[b]||0)+(fT[b]||0)-((sT[a]||0)+(fT[a]||0)))
    .forEach(k => {
      const fp=fT[k]||0, sp=sT[k]||0;
      if(fp+sp < 2) return;
      const fP=Math.round(fp/Math.max(1,f.length)*100), sP=Math.round(sp/Math.max(1,s2.length)*100);
      const col = TASK_COLOR[k]||"#a09080";
      tH += `<div class="hb"><div style="display:flex;align-items:center;min-width:0"><span style="white-space:nowrap;max-width:7em;overflow:hidden;text-overflow:ellipsis">${esc(k)}</span>
        <div class="hb-bar"><div style="width:${fP}%;background:${col};opacity:.4"></div></div></div>
        <div class="hb-v">${fd(fp,sp)||"→"}</div></div>`;
    });
  return `<div class="two">
    <div class="hb-box"><div style="font-weight:600;font-size:.85rem">环境有没有挪</div>
      <div class="hb-l">浅色是前半，数字是占比，右边是前→后</div>${eH||`<span style="color:var(--muted);font-size:.85rem">几乎没换场</span>`}</div>
    <div class="hb-box"><div style="font-weight:600;font-size:.85rem">任务有没有挪</div>
      <div class="hb-l">前半比后半</div>${tH||`<span style="color:var(--muted);font-size:.85rem">类型差不多</span>`}</div>
  </div>`;
}

// ── Day drill ──
function renderDay(list, dk){
  const ds = list.filter(s=>s.date===dk).sort((a,b)=>String(a.created).localeCompare(String(b.created)));
  if(!ds.length) return `<div class="ep">这一天没有对话</div>`;
  let h = `<div style="margin:4px 0 12px"><button type="button" class="bk" data-action="close-day">← 收起</button>
    <div style="font-weight:600;margin:10px 0;font-family:var(--serif)">${esc(dk)} · ${ds.length} 次对话</div>`;
  ds.forEach(s => {
    h += `<div class="sc" data-go-session="${esc(s.id)}">
      <div class="sc-l"><span>${esc(s.summary||"（没有摘要）")}</span><span style="color:var(--muted);font-size:.76rem;white-space:nowrap">${esc(ek(s.family).l)}</span></div>
      <div class="sc-m"><span>${hf(s.minutes)}</span><span>${s.messages||0} 条消息</span><span>${s.tools||0} 次工具</span>
      ${s.errors?`<span style="color:var(--bad)">⚠ ${s.errors} 错</span>`:""}<span style="color:var(--muted)">${esc(s.task||"")}</span></div></div>`;
  });
  return h + "</div>";
}

// ── Session detail ──
function renderSession(sid){
  const s = SS.find(x => x.id === sid);
  if(!s) return `<div class="ep">找不到这条会话（可能已被过滤或索引未更新）</div>`;
  const tu = s.tool_usage || {};
  const tl = Object.entries(tu).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const mx = Math.max(1, ...Object.values(tu), 1);
  return `<div style="margin:4px 0">
    <button type="button" class="bk" data-action="back-day">← 返回当天</button>
    <div class="card" style="margin-top:10px">
      <div style="font-weight:500;font-size:.95rem">${esc(s.summary||"（没有摘要）")}</div>
      <div class="sd-grid">${[
        ["环境", ek(s.family).l],
        ["开始", String(s.created||"").slice(0,16).replace("T"," ")],
        ["活跃用时", hf(s.minutes)],
        ["消息", s.messages||0],
        ["工具", s.tools||0],
        ["错误", s.errors||0],
        ["Token", s.tokens ? String(s.tokens) : "—"],
        ["任务", s.task||"—"]
      ].map(([k,v])=>`<div><div class="sd-l">${k}</div><div>${esc(v)}</div></div>`).join("")}</div>
      ${tl.length ? `<div style="margin-top:6px"><div class="sd-l" style="margin-bottom:6px">用过哪些工具</div>${
        tl.map(([t,n])=>`<div class="tool-bar"><div class="tool-n"><span>${esc(t)}</span>
          <div class="tool-f"><div class="tool-fi" style="width:${Math.round(n/mx*100)}%"></div></div></div>
          <span class="tool-c">${n}</span></div>`).join("")
      }</div>` : ""}
      ${s.project ? `<div style="margin-top:8px;color:var(--muted);font-size:.74rem">项目：${esc(s.project)}</div>` : ""}
    </div>
    <button type="button" class="bk" data-action="back-ov" style="margin-top:10px">← 回总览</button>
  </div>`;
}

function leadChips(list, isOverview){
  if(!list.length) return "";
  const st = envStats(list);
  const top = st.keys[0];
  const tm = st.totalMin;
  const days = new Set(list.map(s=>s.date)).size;
  let chips = "";
  if(isOverview && top){
    chips += `<span class="lead-chip"><span class="sw" style="background:${ek(top).c}"></span>用得最多 <b>${esc(ek(top).l)}</b>（${hf(st.mins[top])}）</span>`;
    chips += `<span class="lead-chip"><b>${st.keys.length}</b> 家环境</span>`;
  }
  chips += `<span class="lead-chip"><b>${list.length}</b> 次对话</span>`;
  chips += `<span class="lead-chip"><b>${hf(tm)}</b> 大概用了多久</span>`;
  chips += `<span class="lead-chip"><b>${days}</b> 天动过手</span>`;
  // Token chip: same period list, display-capped total + coverage
  const tokList = list.filter(s => tokRaw(s) > 0);
  if(tokList.length >= 3){
    const tr = tokList.reduce((a,s)=>a+tokDisp(s),0);
    const covP = Math.round(tokList.length/Math.max(1,list.length)*100);
    chips += `<span class="lead-chip" title="异常大值已压过的 Token 合计"><b>${fmtTok(tr)}</b> Token · ${covP}% 有用量</span>`;
  }
  return `<div>${chips}</div>`;
}

/** Main story after homepage usage deck. Token/model already on top when skipToken. */
function detailBody(list, {showEnv, startNum, skipToken}){
  let n = startNum;
  const parts = [];
  const c = cov(list);

  // 1. 花在哪（环境）
  if(showEnv){
    parts.push(card(n++, "时间花在哪家", "用得多的在前，少的在后。点一家，进去看细账。", renderEnvs(list)));
  }

  // 2. 花在哪类事
  const taskDesc = c.tools >= .2
    ? "按工具和摘要大致归了类，扫一眼重心就行。"
    : "工具日志不多，分类只供参考，百分比别太当真。";
  let right = "";
  if(c.summary >= .1 || c.topics >= .08){
    right = card(n, "老在聊什么", "从摘要里抽的标题，重复多的排前面。", renderTopics(list), ' style="margin-top:0"');
  } else if(c.models >= .15 && !skipToken){
    // only when models not already in homepage deck
    const mc = {};
    list.forEach(s => { if(s.model) mc[s.model]=(mc[s.model]||0)+1; });
    const top = Object.entries(mc).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const mx = Math.max(1, ...top.map(x=>x[1]));
    right = card(n, "常开哪些模型", "这阵子写得出模型名的会话。", top.map(([name,cnt])=>{
      const w=Math.max(4,Math.round(cnt/mx*100));
      return `<div class="tb"><div class="tb-row"><span class="tb-name">${esc(name)}</span>
        <div class="tb-track"><div class="tb-fill" style="width:${w}%;background:var(--viz-alt)"></div></div>
        <span class="tb-n">${cnt}</span></div><div class="tb-pct">${Math.round(cnt/list.length*100)}%</div></div>`;
    }).join("") || '<div class="ep">还没有</div>', ' style="margin-top:0"');
  }
  n++;
  if(right){
    parts.push(`<div class="two" style="margin-top:16px">
      ${card(n-1, "都在忙什么", taskDesc, renderTasks(list), ' style="margin-top:0"')}
      ${right}
    </div>`);
  } else {
    parts.push(card(n-1, "都在忙什么", taskDesc, renderTasks(list)));
  }

  // 3. Token only when not already on homepage deck
  if(!skipToken && list.some(s => tokRaw(s) > 0 || normModel(s.model))){
    const nTok = list.filter(s => tokRaw(s) > 0).length;
    const sumDisp = list.reduce((a,s)=>a+tokDisp(s),0);
    const title = nTok
      ? `Token 花了大约 ${fmtTok(sumDisp)}（${nTok} 次有用量）`
      : "Token 和模型";
    parts.push(card(n++, title,
      "只看各家会话日志里写了的用量和模型名。异常大的数压过，原始合计在下面。",
      renderTokenModel(list)));
  }

  // 4. 什么时候
  parts.push(card(n++, "什么时候最忙",
    c.minutes>=.15 ? "左边是按天的用时，右边是星期和钟点。点日历能下钻到那天。" : "左边是按天的次数，右边是星期和钟点。点日历能下钻到那天。",
    `<div class="when-grid"><div><div class="sec-h">日历</div>${renderCal(list)}</div>
     <div><div class="sec-h">一周里几点开聊</div>${renderHour(list)}</div></div>`));

  // 5. 该不该收手
  parts.push(card(n++, "该不该收手", "三件事：用得是不是太多，重心对不对，哪些该自己拍板。", renderReflect(list)));

  // Secondary
  const moreParts = [];
  moreParts.push(card("·", "各家能统计什么", "绿是够看，黄是残缺，灰是源端基本没写。", fidelityStrip(list) + renderCapability(list)));
  moreParts.push(card("·", "按月看一眼", "每月聊了多少、大概用了多久。", renderMonths(list)));
  if(list.length >= 6){
    moreParts.push(card("·", "习惯有没有变", "前半截和后半截对比，看环境和任务有没有挪位。", renderShift(list)));
  }
  parts.push(`<details class="more"><summary>还想看细节</summary>${moreParts.join("")}</details>`);

  return parts.join("");
}

    foot = "";
  } else if(dayKey){
    header = `<div class="pg-header"><div class="pg-eyebrow"><i></i>这一天</div>
      <h1 class="pg-title" style="font-size:1.25rem">${esc(dayKey)}</h1>
      <div class="pg-meta">${page==="en"?esc(ek(envFocus).l)+" · ":""}近 ${mo} 个月范围内</div></div>`;
    body = renderDay(list, dayKey);
    foot = "";
  } else if(page === "en" && envFocus){
    const name = ek(envFocus).l;
    const col = ek(envFocus).c;
    header = `<div style="margin-bottom:8px"><button type="button" class="bk" data-go-ov>← 全部环境</button></div>
      <div class="pg-header">
        <div class="pg-eyebrow"><i style="background:${col};box-shadow:0 0 0 4px ${col}22"></i>只看一家</div>
        <h1 class="pg-title">最近怎么在用 ${esc(name)}</h1>
        <p class="pg-sub">和总览一样：先看用量总览，再看忙什么、什么时候忙、该不该收手。</p>
        ${leadChips(list, false)}
        <div class="pg-meta">近 ${mo} 个月 · 只有 ${esc(name)} · ${list.length} 次对话</div>
      </div>`;
    if(!list.length){
      body = `<div class="ep">近 ${mo} 个月「${esc(name)}」没有会话。把顶部时段拉长，或确认索引已经扫过这家。</div>`;
    } else {
      const advice = renderAdvice(list);
      // Env page: deck + story; token already in deck
      body = (advice ? `<div class="advice">${advice}</div>` : "")
        + renderStats(list)
        + renderUsageDeck(list)
        + detailBody(list, {showEnv:false, startNum:1, skipToken:true});
    }
    foot = `<div class="foot">只看 ${esc(name)}。侧栏左边那条色是这家标记；顶栏主题名管的是整页底色和强调色，不会被这家盖掉。</div>`;
  } else {
    header = `<div class="pg-header">
      <div class="pg-eyebrow"><i></i>本机全景</div>
      <h1 class="pg-title">你最近怎么在用 AI</h1>
      <p class="pg-sub">首页先看用时、Token、模型偏好；下面再拆各家、任务和日历。有数才画，没有就空着。</p>
      ${leadChips(list, true)}
      <div class="pg-meta">近 ${mo} 个月 · ${list.length} 次对话 · ${(R.generated||"").toString().replace("T"," ").slice(0,16)} 生成</div>
    </div>`;
    if(!list.length){
      body = `<div class="ep">这段时间几乎没有记录。先跑一遍索引，或把顶部时段拉长。</div>`;
    } else {
      const advice = renderAdvice(list);
      // Homepage: hero → usage deck (time/token/model) → rest of story
      body = (advice ? `<div class="advice">${advice}</div>` : "")
        + renderStats(list)
        + renderUsageDeck(list)
        + detailBody(list, {showEnv:true, startNum:1, skipToken:true});
    }
  }

  main.innerHTML = topbar + header + body + foot;
  renderSidebar(listAll);
}

// ── Single click router (sidebar + main; no double-fire) ──
function onAppClick(e){
  const inApp = e.target.closest("#sidebar, #main");
  if(!inApp) return;

  const mBtn = e.target.closest("#periodSeg [data-m]");
  if(mBtn){
    mo = +mBtn.dataset.m;
    dayKey = null; sessionId = null;
    render();
    window.scrollTo({top:0, behavior:"smooth"});
    return;
  }
  const thBtn = e.target.closest("#themeSeg [data-theme-mode]");
  if(thBtn){
    themeMode = applyTheme(thBtn.getAttribute("data-theme-mode"));
    // Sync active state without full re-render (preserves scroll / open details)
    document.querySelectorAll("#themeSeg [data-theme-mode]").forEach(b => {
      const on = b.getAttribute("data-theme-mode") === themeMode;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    return;
  }
  if(e.target.closest("[data-go-ov]")){
    page = "ov"; envFocus = null; dayKey = null; sessionId = null;
    render(); window.scrollTo({top:0, behavior:"smooth"}); return;
  }
  const envEl = e.target.closest("[data-go-env]");
  if(envEl){
    page = "en"; envFocus = envEl.getAttribute("data-go-env");
    dayKey = null; sessionId = null;
    render(); window.scrollTo({top:0, behavior:"smooth"}); return;
  }
  const dayEl = e.target.closest("[data-go-day]");
  if(dayEl){
    dayKey = dayEl.getAttribute("data-go-day");
    sessionId = null;
    render(); return;
  }
  const sessEl = e.target.closest("[data-go-session]");
  if(sessEl){
    sessionId = sessEl.getAttribute("data-go-session");
    render(); return;
  }
  if(e.target.closest("[data-action='close-day']")){
    dayKey = null; render(); return;
  }
  if(e.target.closest("[data-action='back-day']")){
    sessionId = null; render(); return;
  }
  if(e.target.closest("[data-action='back-ov']")){
    sessionId = null; dayKey = null; render(); return;
  }
}
document.addEventListener("click", onAppClick);

// Floating tip for heatmaps / bars (native title is hard to read on dense grids)
const tipEl = document.getElementById("tip");
function tipShow(e, text){
  if(!tipEl || !text) return;
  tipEl.textContent = text;
  tipEl.classList.add("show");
  tipEl.setAttribute("aria-hidden", "false");
  tipMove(e);
}
function tipMove(e){
  if(!tipEl || !tipEl.classList.contains("show")) return;
  const x = Math.min(window.innerWidth - 20, Math.max(20, e.clientX));
  const y = Math.max(28, e.clientY - 8);
  tipEl.style.left = x + "px";
  tipEl.style.top = y + "px";
}
function tipHide(){
  if(!tipEl) return;
  tipEl.classList.remove("show");
  tipEl.setAttribute("aria-hidden", "true");
}
document.addEventListener("pointerover", e => {
  const el = e.target.closest("[title], .cell:not(.dim), .h, .tb-fill, .env-stack span, .ec");
  if(!el) return;
  const t = el.getAttribute("title") || el.getAttribute("data-tip");
  if(t) tipShow(e, t);
});
document.addEventListener("pointermove", tipMove);
document.addEventListener("pointerout", e => {
  // Don't flash-hide when moving between sibling tip targets (heatmap cells)
  const rel = e.relatedTarget;
  if(rel && rel.closest && rel.closest("[title], .cell:not(.dim), .h, .tb-fill, .env-stack span, .ec")) return;
  if(e.target.closest("[title], .cell, .h, .tb-fill, .env-stack span, .ec")) tipHide();
});

// Dev hooks: console → ReflectReport.render() / .state
window.ReflectReport = {
  render,
  get state(){ return {mo, page, envFocus, dayKey, sessionId, theme: themeMode, n: SS.length}; },
  setMonths(m){ mo=+m; dayKey=null; sessionId=null; render(); },
  openEnv(k){ page="en"; envFocus=k; dayKey=null; sessionId=null; render(); },
  setTheme(t){ themeMode = applyTheme(t); render(); },
};
window.render = render; // convenience

render();
})();
</script>
